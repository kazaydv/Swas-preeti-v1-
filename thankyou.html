<style>
  :root{--white:#fff;--black:#0B0B0B;--gray-line:#E4E4E4;--gray-soft:#F7F7F7;--gray-text:#6B6B6B;--accent:#FF4438;--accent-dark:#D6291F;--accent-tint:#FFF0EE;--radius-lg:16px;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--gray-soft);color:var(--black);font-family:'Inter','Noto Sans Devanagari',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:40px 20px;}
  .card{background:var(--white);border:1px solid var(--gray-line);border-radius:var(--radius-lg);padding:40px 32px;text-align:center;}
  .check{width:72px;height:72px;border-radius:50%;background:#1E9E4A;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
  .logo{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:18px;margin-bottom:24px;}
  .oval{display:inline-block;width:24px;height:14px;border-radius:100px;border:4.5px solid currentColor;}
  h1{font-size:24px;margin:0 0 8px;}
  p.sub{color:var(--gray-text);font-size:15px;margin:0 0 24px;}
  .steps{text-align:left;margin:0 0 28px;display:flex;flex-direction:column;gap:12px;}
  .step{display:flex;gap:12px;align-items:flex-start;background:var(--gray-soft);border-radius:10px;padding:14px;}
  .step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--black);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .step p{margin:0;font-size:14px;color:var(--black);}
  .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;padding:15px 32px;border-radius:100px;border:none;font-size:16px;font-weight:700;text-decoration:none;}
  .btn:hover{background:var(--accent-dark);}
  .note{margin-top:18px;font-size:12.5px;color:var(--gray-text);}
</style>

      <div class="step"><span class="n">2</span><p>२–३ दिनभित्र तपाईंको ठेगानामा डेलिभरी हुनेछ।</p></div>
      <div class="step"><span class="n">3</span><p>सामान हातमा आएपछि मात्र भुक्तानी गर्नुहोस् (Cash on Delivery)।</p></div>
    </div>
